<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} — Saad Bin Ekram</title>
<meta name="description" content="{{ page.excerpt | default: page.title | strip_html | truncate: 150 }}">
<style>
  :root{
    --navy:#243b53; --gold:#f0b429; --gold-soft:#f7cf6b;
    --paper:#ffffff; --panel:#f7f9fb; --line:#e4e9ef;
    --ink:#23303d; --soft:#3f4d5b; --muted:#6b7987; --side:280px; --chip:#eef2f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.75; -webkit-font-smoothing:antialiased}
  a{color:#2f6db0; text-decoration:none} a:hover{text-decoration:underline}

  .sidebar{position:fixed; top:0; left:0; width:var(--side); height:100vh; overflow-y:auto;
    background:var(--navy); color:#dbe4ee; padding:38px 26px; display:flex; flex-direction:column}
  .sidebar .avatar{width:96px; height:96px; border-radius:50%; display:grid; place-items:center;
    font-size:2rem; font-weight:700; color:var(--navy); letter-spacing:1px; background:var(--gold); margin-bottom:20px}
  .sidebar h1{font-size:1.42rem; line-height:1.2; color:#fff; margin-bottom:6px}
  .sidebar h1 a{color:#fff}
  .sidebar .role{font-size:.9rem; color:#aebfd1; font-weight:500}
  .sidebar .aff{font-size:.82rem; color:#8ba0b6; margin-top:6px; line-height:1.5}
  .side-nav{margin-top:26px; display:flex; flex-direction:column; gap:2px}
  .side-nav a{color:#c3d0de; font-size:.92rem; font-weight:500; padding:8px 12px; border-radius:8px;
    border-left:3px solid transparent; transition:all .15s}
  .side-nav a:hover{background:rgba(255,255,255,.06); color:#fff; text-decoration:none; border-left-color:var(--gold)}
  .side-nav a.active{background:rgba(240,180,41,.14); color:#fff; border-left-color:var(--gold)}
  .side-foot{margin-top:auto; padding-top:24px; color:#6f8298; font-size:.72rem}

  .main{margin-left:var(--side); max-width:680px; padding:52px 46px 60px}
  .back{display:inline-block; color:var(--muted); font-size:.86rem; margin-bottom:20px}
  .back:hover{color:#b8860b; text-decoration:none}
  .post-date{color:#b8860b; font-size:.78rem; text-transform:uppercase; letter-spacing:1.5px; font-weight:700; margin-bottom:10px}
  .main h1.post-title{font-size:1.95rem; line-height:1.25; color:var(--navy); margin-bottom:26px}

  .content{color:var(--soft); font-size:1.04rem}
  .content h2{color:var(--navy); font-size:1.4rem; margin:32px 0 12px}
  .content h3{color:var(--navy); font-size:1.15rem; margin:24px 0 10px}
  .content p{margin-bottom:18px}
  .content ul,.content ol{margin:0 0 18px 22px}
  .content li{margin-bottom:8px}
  .content blockquote{border-left:3px solid var(--gold); background:var(--panel);
    padding:12px 18px; border-radius:0 10px 10px 0; margin:0 0 18px; color:var(--soft); font-style:italic}
  .content code{background:var(--chip); border:1px solid var(--line); border-radius:6px;
    padding:2px 6px; font-size:.9em; font-family:ui-monospace,Menlo,Consolas,monospace}
  .content pre{background:#0f2033; color:#e6edf5; border-radius:12px; padding:16px 18px; overflow-x:auto; margin:0 0 18px}
  .content pre code{background:none; border:none; padding:0; color:inherit}
  .content img{max-width:100%; height:auto; border-radius:12px; margin:6px 0 18px; border:1px solid var(--line)}
  .content hr{border:none; border-top:1px solid var(--line); margin:28px 0}
  .foot{margin-top:38px; padding-top:22px; border-top:1px solid var(--line)}

  @media(max-width:860px){
    .sidebar{position:static; width:100%; height:auto; flex-direction:column; padding:30px 24px}
    .side-nav{flex-direction:row; flex-wrap:wrap; gap:6px; margin-top:20px}
    .side-nav a{border-left:none; border-bottom:3px solid transparent; padding:6px 10px}
    .side-nav a:hover,.side-nav a.active{border-left:none; border-bottom-color:var(--gold)}
    .side-foot{display:none}
    .main{margin-left:0; padding:32px 24px 50px; max-width:100%}
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="avatar">SE</div>
  <h1><a href="/">Saad Bin Ekram</a></h1>
  <div class="role">MSc Nanoscience &amp; Nanotechnology — Nanoelectronics</div>
  <div class="aff">Erasmus Mundus Scholar<br>TU Dresden, Germany &amp; KU Leuven, Belgium</div>
  <nav class="side-nav">
    <a href="/#about">Research Interests</a>
    <a href="/#publications">Publications</a>
    <a href="/blog/" class="active">Blog</a>
  </nav>
  <div class="side-foot">&copy; 2026 Saad Bin Ekram</div>
</aside>

<main class="main">
  <a class="back" href="/blog/">&larr; All notes</a>
  <div class="post-date">{{ page.date | date: "%B %-d, %Y" }}</div>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="content">
    {{ content }}
  </div>
  <div class="foot">
    <a href="/blog/">&larr; Back to all notes</a>
  </div>
</main>

</body>
</html>
